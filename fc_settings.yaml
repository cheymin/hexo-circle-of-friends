# 友链页地址
LINK: [
    { link: "https://blog.346247.xyz/link/", theme: "butterfly" },
]

# 配置项友链
SETTINGS_FRIENDS_LINKS: {
    enable: false,
    json_api_or_path: "",
    list: [
    ]
}

# block site list
BLOCK_SITE: [
]

# 是否反向屏蔽站点
BLOCK_SITE_REVERSE: false

# 从每个主页中最多获取几篇文章
MAX_POSTS_NUM: 5

# 过期文章清除（天）
OUTDATE_CLEAN: 60

# 定时任务，每天0/6/12/18/21点执行一次（UTC时间）
CRON: "0 0,6,12,18,21 * * *"

# 极简模式
SIMPLE_MODE: false

# 存储方式：sqlite（免数据库，数据存仓库里）
DATABASE: "sqlite"

# 部署方式：github（用 GitHub Actions 跑，无需服务器）
DEPLOY_TYPE: "github"

# 文章摘要（保持关闭，如需 AI 摘要可改 enabled: true）
GENERATE_SUMMARY: {
  enabled: false,
  provider: "all",
  max_concurrent: 3,
  wait_on_rate_limit: true,
  max_chars: 8000,
  gemini: {
    models: ["gemini-2.5-flash", "gemini-2.5-pro", "gemini-2.5-flash-lite"]
  },
  siliconflow: {
    models: [
      "THUDM/GLM-4.1V-9B-Thinking",
      "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B",
      "Qwen/Qwen3-8B",
      "THUDM/GLM-Z1-9B-0414",
      "THUDM/GLM-4-9B-0414",
      "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B",
      "Qwen/Qwen2.5-7B-Instruct",
      "Qwen/Qwen2.5-Coder-7B-Instruct",
      "internlm/internlm2_5-7b-chat",
      "Qwen/Qwen2-7B-Instruct",
      "THUDM/glm-4-9b-chat"
    ]
  },
  bigmodel: {
    models: [
      "glm-4.5-flash",
      "glm-4-flash-250414"
    ]
  }
}
